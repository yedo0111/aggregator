name: MirrorSub

on:
  workflow_run:
    workflows: ["Refresh"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout sub branch
        uses: actions/checkout@v4
        with:
          ref: sub
      - name: Fetch subscription files from Gist
        run: |
          base="https://gist.githubusercontent.com/yedo0111/8b2bba33461d98bbf5063c26a9a1fcb0/raw"
          curl -fsSL "$base/clash.yaml" -o clash.yaml
          curl -fsSL "$base/singbox.json" -o singbox.json
          curl -fsSL "$base/v2ray.txt" -o v2ray.txt
      - name: Commit and push if changed
        run: |
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git add clash.yaml singbox.json v2ray.txt
          git diff --cached --quiet || git commit -m "mirror subscription files"
          git push origin sub
      - name: Purge jsDelivr cache
        run: |
          for f in clash.yaml singbox.json v2ray.txt; do
            curl -s "https://purge.jsdelivr.net/gh/yedo0111/aggregator@sub/$f" || true
          done
